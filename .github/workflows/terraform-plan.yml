name: Terraform plan

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "terraform/**"

permissions:
  contents: read

concurrency:
  group: terraform-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    name: Validate and plan
    # Fork pull requests must not receive an AWS OIDC token or AWS credentials.
    if: github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@4a1596c86fd706dc0521e32f0121ad1a6d1adb74 # v6
        with:
          aws-region: us-east-2
          role-to-assume: arn:aws:iam::242668368155:role/areopagus-github-actions-plan
          role-session-name: areopagus-terraform-plan-${{ github.run_id }}

      - name: Initialize Terraform
        run: terraform init -input=false -backend-config backend.plan.hcl

      - name: Validate configuration
        run: terraform validate -no-color

      - name: Create Terraform plan
        run: terraform plan -input=false -lock-timeout=5m
