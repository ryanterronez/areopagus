name: Terraform

on:
  pull_request:
    paths:
      - "terraform/**"

permissions:
  contents: read

jobs:
  validate-and-plan:
    name: Format, validate, and plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize without a backend
        run: terraform init -backend=false -input=false

      - name: Validate configuration
        run: terraform validate -no-color

      - name: Create plan
        run: |
          if ! find . -type f -name '*.tf' -print -quit | grep -q .; then
            echo "No Terraform configuration files found; skipping plan."
            exit 0
          fi

          terraform plan -input=false -lock=false -no-color -out=tfplan
