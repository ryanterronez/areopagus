name: Terraform apply

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-apply
  cancel-in-progress: false

jobs:
  apply:
    name: Apply Terraform changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@4a1596c86fd706dc0521e32f0121ad1a6d1adb74 # v6
        with:
          aws-region: us-east-2
          role-to-assume: arn:aws:iam::242668368155:role/areopagus-github-actions-deployment
          role-session-name: areopagus-terraform-apply-${{ github.run_id }}

      - name: Initialize Terraform
        run: terraform init -input=false -backend-config backend.apply.hcl

      - name: Validate Terraform configuration
        run: terraform validate

      - name: Create Terraform plan
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan

      - name: Apply Terraform plan
        run: terraform apply -input=false tfplan
